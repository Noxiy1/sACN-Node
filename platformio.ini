[platformio]
default_envs = esp32-eth01

[env:esp32-eth01]
platform = espressif32@6.5.0
board = esp32
framework = arduino

; ESP32-ETH01 spezifische Konfiguration
board_build.f_cpu = 240000000L
board_build.f_flash = 40000000L
upload_speed = 921600
monitor_speed = 115200

; Partition Scheme (für Ethernet)
board_build.partitions = large_spiffs_16MB.csv

; Serial Monitor
monitor_filters = esp32_exception_decoder

; Build Flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DESP32
    -DETH_PHY_TYPE=0
    ; Ethernet Treiber
    -DIP101=0
    -DRMII=1
    -DETH_CLOCK_GPIO0_IN

; Abhängigkeiten (Libraries)
lib_deps =
    ; Offizielle ESP32 Libraries
    AsyncUDP@1.2.0
    
    ; Optional: Für erweiterte Diagnostik
    ; https://github.com/me-no-dev/ESPAsyncUDP.git

; Memory Optimierung
board_build.flash_mode = qio
board_build.flash_freq = 80m

; Debugging (optional aktivieren)
; debug_tool = esp-prog
; debug_port = /dev/ttyUSB0
